[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huflit-qa"
version = "0.2.0"
description = "Hybrid retrieval over HUFLIT academic regulations and announcements"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mai Dong Anh", email = "bebaobanhbaoo@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    # Scraping
    "requests==2.34.2",
    "beautifulsoup4==4.12.3",
    "lxml==5.1.0",
    "PyMuPDF==1.24.0",
    # Indexing & retrieval
    "numpy==2.3.5",
    "rank-bm25==0.2.2",
    "pyvi==0.1.1",
    "faiss-cpu==1.10.0",
    "qdrant-client==1.19.1",
    "torch==2.5.1",
    "sentence-transformers==3.4.1",
    "transformers==4.57.6",
    "huggingface-hub>=0.34.0,<1.0",
    # App
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "typer==0.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.3",
    "mypy==1.18.2",
    "pre-commit==4.3.0",
    "types-requests",
]

[project.scripts]
huflit-qa = "huflit_qa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Vietnamese text in strings/comments uses characters ruff flags as ambiguous.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/huflit_qa/cli.py" = ["B008"]  # typer declares options as default values

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
