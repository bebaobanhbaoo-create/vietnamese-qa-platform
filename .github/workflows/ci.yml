name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Unit tests only cover pure-Python modules for now; the full ML stack is installed in phase 5.
      - run: pip install pytest==9.1.1
      - run: pytest -q
