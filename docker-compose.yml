# API + chat page with a Qdrant server and a local LLM.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct    # once, ~4.7 GB
#   open http://localhost:8080                                     # Qdrant UI: http://localhost:6333/dashboard
#
# `qdrant-init` copies the vectors shipped in data/index/qdrant into the server (only changed points,
# so it is cheap on every start); the API then searches the server instead of the embedded copy.
# Ollama uses an NVIDIA GPU when the NVIDIA Container Toolkit is installed; remove the `deploy`
# block to run it on CPU (slow for a 7B model).

x-qdrant-env: &qdrant-env
  HUFLIT_INDEX__QDRANT_URL: http://qdrant:6333

services:
  api:
    build: .
    image: huflit-qa:local
    ports:
      - "8080:8080"
    environment:
      <<: *qdrant-env
      HUFLIT_GENERATION__OLLAMA_URL: http://ollama:11434
      HUFLIT_GENERATION__MODEL: qwen2.5:7b-instruct
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    restart: unless-stopped

  qdrant-init:
    image: huflit-qa:local
    command: ["huflit-qa", "push-vectors"]
    environment: *qdrant-env
    depends_on:
      - qdrant
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qdrant-data:
  ollama-models:
